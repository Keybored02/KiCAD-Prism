name: Production images

# Builds the production branch into images on GHCR:
#   ghcr.io/<owner>/kicad-prism-backend:production   (and :sha-<short>)
#   ghcr.io/<owner>/kicad-prism-frontend:production  (and :sha-<short>)

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images
  cancel-in-progress: true

jobs:
  build:
    name: Build and push AMD64 images
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out production
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record build metadata
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          short="$(git rev-parse --short=12 HEAD)"
          echo "backend=ghcr.io/$owner/kicad-prism-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/kicad-prism-frontend" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}:production
            ${{ steps.meta.outputs.backend }}:sha-${{ steps.meta.outputs.short }}
          build-args: |
            KICAD_BASE_PLATFORM=linux/amd64
            PRISM_RELEASE=production-${{ steps.meta.outputs.short }}
            PRISM_REVISION=${{ github.sha }}
            PRISM_BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=production-backend-amd64
          cache-to: type=gha,mode=max,scope=production-backend-amd64

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}:production
            ${{ steps.meta.outputs.frontend }}:sha-${{ steps.meta.outputs.short }}
          build-args: |
            PRISM_RELEASE=production-${{ steps.meta.outputs.short }}
            PRISM_REVISION=${{ github.sha }}
            PRISM_BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=production-frontend-amd64
          cache-to: type=gha,mode=max,scope=production-frontend-amd64
